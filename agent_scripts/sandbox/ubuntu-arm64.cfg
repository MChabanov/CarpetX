# Option list for the Einstein Toolkit inside the sbx sandbox
# (Ubuntu 26.04 arm64, image built from agent_scripts/sandbox/template.dockerfile)
#
# Derived from scripts/actions-cpu-real64.cfg with the x86-only flags
# removed (-march=x86-64-v3, -fcf-protection) and library paths moved
# from x86_64-linux-gnu to aarch64-linux-gnu.  Directories not present
# in the sandbox image are dropped (Conduit, SimulationIO, PETSc, PAPI).
#
# AMREX_DIR points at the AMReX built from the mounted ../amrex source
# by agent_scripts/sandbox/setup.sh; if no amrex workspace is mounted,
# setup.sh symlinks it to /usr/local, which holds the AMReX release
# baked into the image.

# Whenever this version string changes, the application is configured
# and rebuilt from scratch
VERSION = sbx-arm64-gcc15-real64-2026-07-13

CPP = cpp
CC = gcc
CXX = g++
FPP = cpp
FC = gfortran
F90 = gfortran

CFLAGS = -g -pipe -std=gnu11
CXXFLAGS = -g -pipe -std=gnu++20
FPPFLAGS = -traditional
F90FLAGS = -g -pipe -fcray-pointer -ffixed-line-length-none -finit-character=65 -finit-integer=42424242 -finit-real=nan
LDFLAGS = -L/usr/lib/aarch64-linux-gnu -Wl,-rpath,/usr/local/lib -Wl,-rpath,/usr/local/lib64 -Wl,-rpath,/home/agent/cactus/amrex-lib/lib

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

INTEGER_PRECISION = 4
REAL_PRECISION = 8

DEBUG = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS = -fbounds-check -fsanitize=undefined -fstack-protector-all -ftrapv
CXX_DEBUG_FLAGS = -fbounds-check -fsanitize=undefined -fstack-protector-all -ftrapv
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
F90_DEBUG_FLAGS = -fcheck=bounds,do,mem,pointer,recursion -fsanitize=undefined -fstack-protector-all -ftrapv

OPTIMISE = yes
C_OPTIMISE_FLAGS = -O3 -fcx-limited-range -fexcess-precision=fast -ffp-contract=fast -fno-math-errno -fno-rounding-math -fno-signaling-nans
CXX_OPTIMISE_FLAGS = -O3 -fcx-limited-range -fexcess-precision=fast -ffp-contract=fast -fno-math-errno -fno-rounding-math -fno-signaling-nans
F90_OPTIMISE_FLAGS = -O3 -fcx-limited-range -fexcess-precision=fast -ffp-contract=fast -fno-math-errno -fno-rounding-math -fno-signaling-nans

OPENMP = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp
LD_OPENMP_FLAGS = -fopenmp

WARN = yes
CPP_WARN_FLAGS = -Wall
C_WARN_FLAGS =
CXX_WARN_FLAGS =
FPP_WARN_FLAGS = -Wall
F90_WARN_FLAGS = -Wall -Wshadow -Wsurprising

ADIOS2_DIR = /usr/local
ADIOS2_LIBS = adios2_cxx11_mpi adios2_cxx11 mgard protobuf
AMREX_DIR = /home/agent/cactus/amrex-lib
BLAS_DIR = /usr
BOOST_DIR = /usr
# no boost_system: Boost.System is header-only and Boost >= 1.89 (this
# image ships 1.90) no longer provides the stub library that the Boost
# thorn's default BOOST_LIBS would link against
BOOST_LIBS = boost_filesystem
FFTW3_DIR = /usr
GSL_DIR = /usr
HDF5_DIR = /usr/lib/aarch64-linux-gnu/hdf5/serial
HDF5_ENABLE_CXX = yes
HDF5_ENABLE_FORTRAN = yes
HDF5_INC_DIRS = /usr/lib/aarch64-linux-gnu/hdf5/serial/include
HDF5_LIB_DIRS = /usr/lib/aarch64-linux-gnu/hdf5/serial/lib
HDF5_LIBS = hdf5_hl_cpp hdf5_cpp hdf5hl_fortran hdf5_fortran hdf5_hl hdf5
HWLOC_DIR = /usr
LAPACK_DIR = /usr
MPI_DIR = /usr
# lowercase: the image's library is named libnsimd_aarch64.so and the
# NSIMD thorn searches for libnsimd_${NSIMD_SIMD}.so verbatim
NSIMD_DIR = /usr/local
NSIMD_SIMD = aarch64
OPENBLAS_DIR = /usr
OPENPMD_API_DIR = /usr/local
PTHREADS_DIR = NO_BUILD
SILO_DIR = /usr/local
SSHT_DIR = /usr/local
YAML_CPP_DIR = /usr/local
ZLIB_DIR = /usr
